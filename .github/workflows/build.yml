name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar projeto (só na 1a vez)
        run: |
          if [ -d app ]; then echo "Projeto já existe"; exit 0; fi
          mkdir -p app/src/main/java/com/revok/sensi app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values

          cat > .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "RevokSensi"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.revok.sensi"
              compileSdk = 34
              defaultConfig { applicationId = "com.revok.sensi"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Revok Sensi" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.Revok">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku" android:enabled="true"
                      android:exported="true" android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.Revok" parent="android:Theme.Material.NoActionBar">
          <item name="android:statusBarColor">#0B0B0B</item><item name="android:navigationBarColor">#0B0B0B</item>
          <item name="android:windowBackground">#0B0B0B</item></style></resources>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
          <gradient android:type="radial" android:gradientRadius="80dp" android:centerX="0.5" android:centerY="0.5"
           android:startColor="#E10600" android:endColor="#3A0000"/></shape>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp"
           android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#000000" android:pathData="M18,50 L26,48 L30,52 L62,52 L62,46 L72,46 L72,52 L80,52 L80,48 L90,48 L90,54 L84,54 L84,58 L66,58 L66,62 L52,62 L50,66 L44,92 L34,92 L40,64 L36,62 L30,62 L30,58 L22,58 L18,56 Z"/>
          <path android:fillColor="#000000" android:pathData="M54,62 L64,62 L66,84 L56,84 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
          <background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/></adaptive-icon>
          EOF

          cat > app/src/main/java/com/revok/sensi/Shell.kt <<'EOF'
          package com.revok.sensi

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku

          object Shell {
              enum class Mode { SHIZUKU, ROOT, NONE }

              fun mode(): Mode = when {
                  runCatching { Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED }
                      .getOrDefault(false) -> Mode.SHIZUKU
                  rootAvailable() -> Mode.ROOT
                  else -> Mode.NONE
              }

              fun requestShizuku() { runCatching { if (Shizuku.pingBinder()) Shizuku.requestPermission(1) } }

              private fun rootAvailable() = runCatching {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", "id"))
                  p.inputStream.bufferedReader().readText().contains("uid=0")
              }.getOrDefault(false)

              fun run(cmd: String): String = when (mode()) {
                  Mode.SHIZUKU -> exec(shizukuProc(cmd))
                  Mode.ROOT -> exec(Runtime.getRuntime().exec(arrayOf("su", "-c", cmd)))
                  Mode.NONE -> "Sem acesso: ative o Shizuku ou o root."
              }

              private fun shizukuProc(cmd: String): Process {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                  m.isAccessible = true
                  return m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
              }

              private fun exec(p: Process): String {
                  val out = p.inputStream.bufferedReader().readText()
                  val err = p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return (out + err).trim()
              }
          }
          EOF

          cat > app/src/main/java/com/revok/sensi/MainActivity.kt <<'EOF'
          package com.revok.sensi

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import kotlin.concurrent.thread
          import kotlin.math.roundToInt

          private val Red = Color(0xFFE10600)

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Red, background = Color(0xFF0B0B0B), surface = Color(0xFF161616))) {
                          Screen()
                      }
                  }
              }
          }

          @Composable
          fun Screen() {
              var mode by remember { mutableStateOf(Shell.mode()) }
              var pointer by remember { mutableFloatStateOf(0f) }
              var refresh by remember { mutableFloatStateOf(60f) }
              var sat by remember { mutableFloatStateOf(100f) }
              var log by remember { mutableStateOf("") }

              fun go(cmd: String) = thread { val r = Shell.run(cmd); log = if (r.isBlank()) "OK: $cmd" else r }

              Column(Modifier.fillMaxSize().background(Color(0xFF0B0B0B)).verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Spacer(Modifier.height(24.dp))
                  Text("REVOK SENSI", style = MaterialTheme.typography.headlineMedium, color = Red)
                  Text("Acesso: ${mode.name}", color = Color.Gray)
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = { Shell.requestShizuku(); mode = Shell.mode() }) { Text("Shizuku") }
                      OutlinedButton(onClick = { thread { mode = Shell.mode() } }) { Text("Verificar root") }
                  }

                  Text("Velocidade do ponteiro: ${pointer.roundToInt()}")
                  Slider(pointer, { pointer = it }, valueRange = -7f..7f, steps = 13,
                      onValueChangeFinished = { go("settings put system pointer_speed ${pointer.roundToInt()}") })

                  Text("Taxa de atualização: ${refresh.roundToInt()} Hz")
                  Slider(refresh, { refresh = it }, valueRange = 60f..144f,
                      onValueChangeFinished = {
                          val hz = refresh.roundToInt()
                          go("settings put system min_refresh_rate $hz; settings put system peak_refresh_rate $hz")
                      })

                  Text("Saturação: ${sat.roundToInt()}%")
                  Slider(sat, { sat = it }, valueRange = 50f..150f,
                      onValueChangeFinished = { go("cmd color_display set-saturation ${(sat / 100f)}") })

                  OutlinedButton(onClick = {
                      pointer = 0f; refresh = 60f; sat = 100f
                      go("settings put system pointer_speed 0; settings delete system min_refresh_rate; " +
                         "settings delete system peak_refresh_rate; cmd color_display set-saturation 1.0")
                  }, modifier = Modifier.fillMaxWidth()) { Text("Restaurar padrão") }

                  if (log.isNotBlank()) Text(log, color = Color.Gray)
              }
          }
          EOF

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Criar projeto Revok Sensi"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RevokSensi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
